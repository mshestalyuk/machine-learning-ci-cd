name: Model Retrain

# Cykliczny / ręczny retrening modelu ryzyka.
# W realnym wdrożeniu zamień generate_dataset.py na ekstrakcję historii
# z własnego repo (git log + powiązanie z incydentami / awariami CI).

on:
  workflow_dispatch:        # ręczne uruchomienie
  schedule:
    - cron: "0 3 * * 1"     # co poniedziałek 03:00 UTC

permissions:
  contents: write           # by zacommitować nowy artefakt modelu

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dataset
        run: python src/generate_dataset.py --n 10000 --out data/changes.csv

      - name: Train model
        run: python src/train_model.py --data data/changes.csv --out model

      - name: Show metrics
        run: cat model/metrics.json

      - name: Commit updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/risk_model.pkl model/baseline.json model/metrics.json
          if git diff --staged --quiet; then
            echo "Model bez zmian — nic do zacommitowania."
          else
            git commit -m "chore: retrain risk model [skip ci]"
            git push
          fi
