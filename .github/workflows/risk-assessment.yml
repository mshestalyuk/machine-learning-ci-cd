name: ML Risk Assessment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write 

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assess-risk:
    runs-on: ubuntu-latest
    env:
      RISK_THRESHOLD_MEDIUM: "0.30"
      RISK_THRESHOLD_HIGH: "0.60"
      RISK_FAIL_ON: ""   
    steps:
      - name: Checkout (pełna historia)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify model artifact
        run: |
          if [ ! -f model/risk_model.pkl ]; then
            echo "::error::Brak model/risk_model.pkl. Uruchom retrain (workflow model-retrain) lub zacommituj model."
            exit 1
          fi

      - name: Extract change features
        run: |
          python src/extract_features.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out features.json

      - name: Score risk
        id: score
        run: |
          python src/score_risk.py \
            --features features.json \
            --model model/risk_model.pkl \
            --baseline model/baseline.json \
            --report risk_report.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ml-risk-assessment -->';
            let body = marker + '\n';
            try {
              body += fs.readFileSync('risk_report.md', 'utf8');
            } catch (e) {
              body += '⚠️ Nie udało się wygenerować raportu ryzyka.';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

      - name: Enforce risk gate
        if: ${{ env.RISK_FAIL_ON != '' && steps.score.outputs.gate_failed == 'true' }}
        run: |
          echo "::error::Bramka ryzyka: poziom ${{ steps.score.outputs.risk_level }} "\
               "(score ${{ steps.score.outputs.risk_score }}) przekracza próg ${RISK_FAIL_ON}."
          exit 1